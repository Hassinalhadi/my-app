name: Patch & Fix Original SRK Bot APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-original-apk:
    name: Patch and Sign Original SRK_Bot_1.10.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Direct Binary Patching on Original SRK_Bot_1.10.apk
        run: |
          python3 - << 'EOF'
          import os, zipfile

          input_apk = "SRK_Bot_1.10.apk"
          output_apk = "output_apk/SRK_Bot_1.10_Original_Fixed.apk.unsigned.apk"
          old_url = b"https://skrbotserver-default-rtdb.firebaseio.com"
          new_url = b"https://srkbot-fix-rtdb.firebaseio.com\x00\x00\x00\x00\x00\x00\x00"

          if not os.path.exists(input_apk):
              raise FileNotFoundError(f"{input_apk} not found in repository root!")

          os.makedirs("output_apk", exist_ok=True)
          print(f"[*] Starting direct binary patch on original {input_apk}...")

          patches = 0
          with zipfile.ZipFile(input_apk, 'r') as zin, zipfile.ZipFile(output_apk, 'w', compression=zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  # Strip old signature files for clean re-signing
                  if item.filename.startswith("META-INF/") and (item.filename.endswith(".SF") or item.filename.endswith(".RSA") or item.filename.endswith(".MF")):
                      continue

                  data = zin.read(item.filename)
                  if old_url in data:
                      count = data.count(old_url)
                      data = data.replace(old_url, new_url)
                      patches += count
                      print(f"  [+] Replaced {count} server URLs in {item.filename}")

                  zout.writestr(item, data)

          print(f"[*] Done! Total patched server entries: {patches}")
          EOF

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias bot_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "android123" \
            -keypass "android123" \
            -dname "CN=SRKBot, O=OriginalSRK, C=SA"

      - name: Zipalign and Sign the Original Patched APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Android Build Tools: $BUILD_TOOLS"

          # 1. Zipalign 4-byte boundaries
          $BUILD_TOOLS/zipalign -f -v -p 4 \
            output_apk/SRK_Bot_1.10_Original_Fixed.apk.unsigned.apk \
            output_apk/SRK_Bot_1.10_Original_Fixed.apk

          # 2. Sign with apksigner (v1 + v2 + v3 full scheme)
          $BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android123 \
            --ks-key-alias bot_key \
            --key-pass pass:android123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            output_apk/SRK_Bot_1.10_Original_Fixed.apk

          # 3. Verify signature integrity
          $BUILD_TOOLS/apksigner verify --verbose output_apk/SRK_Bot_1.10_Original_Fixed.apk

          # Remove temporary unsigned file
          rm -f output_apk/*.unsigned.apk

          echo "Final Original Fixed APK ready:"
          ls -lh output_apk/

      - name: Upload Original Fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: SRK_Bot_1.10_Original_Fixed_APK
          path: output_apk/*.apk
          retention-days: 14
